name: Release Smoke Test

# Starts the minified release build on an emulator: R8 problems (stripped
# classes, missing keep rules) only show up there, never in unit tests or
# the debug build. Signed with a throwaway key, nothing is published.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Release build starts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build release APK with a throwaway key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass smokepass -keypass smokepass \
            -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname "CN=smoke"
          KEYSTORE_PATH="$RUNNER_TEMP/smoke.jks" KEYSTORE_PASSWORD=smokepass KEY_ALIAS=smoke KEY_PASSWORD=smokepass \
            ./gradlew assembleRelease
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/app.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/release_smoke.sh "$RUNNER_TEMP/app.apk"
