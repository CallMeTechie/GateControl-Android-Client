name: Play review videos

# Records the videos Google Play asks for in "App-Inhalte" (VPN service,
# background location, foreground service) plus store screenshots: a
# throwaway GateControl server in Docker, the debug build on an emulator,
# captions burned in with ffmpeg. Nothing is published — download the
# artifact and upload the MP4s to YouTube as "unlisted".
#
# The debug build used here trusts one extra CA (generated per run, only in
# this job) so it can reach the test server over https://10.0.2.2:8443.
on:
  workflow_dispatch:
  # Also when the recording itself changes, so a change is seen working.
  pull_request:
    branches: [main]
    paths:
      - 'scripts/play-media/**'
      - '.github/workflows/play-videos.yml'

permissions:
  # Pushes the results to the play-review-media branch (see the last step).
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  record:
    name: Record review videos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test CA and server certificate for 10.0.2.2
        run: |
          D="$RUNNER_TEMP/ca"; mkdir -p "$D"; cd "$D"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=GateControl recording CA" \
            -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=10.0.2.2" -keyout server.key -out server.csr
          printf 'subjectAltName=IP:10.0.2.2\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
            -extfile ext.cnf -out server.pem
          echo "APP_CA_DIR=$D" >> "$GITHUB_ENV"

      - name: Debug build that trusts the recording CA (this job only)
        run: |
          mkdir -p app/src/debug/res/xml app/src/debug/res/raw
          cp "$APP_CA_DIR/ca.pem" app/src/debug/res/raw/recording_ca.pem
          cat > app/src/debug/res/xml/recording_network_security.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config>
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="@raw/recording_ca" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          XML
          cat > app/src/debug/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:networkSecurityConfig="@xml/recording_network_security" />
          </manifest>
          XML
          ./gradlew assembleDebug -Pgc.extraAbis=x86_64
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/app.apk"

      - name: Start a throwaway GateControl server
        run: scripts/play-media/server.sh "$RUNNER_TEMP/media"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: scripts/play-media/record.sh "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/media/enroll-link.txt" "$RUNNER_TEMP/media"

      - name: Captions and final videos
        if: always()
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core; }
          python3 scripts/play-media/compose.py "$RUNNER_TEMP/media"

      - name: Server log
        if: failure()
        run: docker logs gc 2>&1 | tail -150

      # Also as a branch: easy to look at in the browser and to fetch with git.
      - name: Publish to the play-review-media branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TOKEN: ${{ github.token }}
        run: |
          M="$RUNNER_TEMP/media"; P="$RUNNER_TEMP/publish"
          mkdir -p "$P/screenshots" && cd "$P"
          cp "$M"/*.mp4 . 2>/dev/null || true
          cp "$M"/screenshots/*.png screenshots/ 2>/dev/null || true
          cp "$M"/fail-*.png . 2>/dev/null || true
          cp "$M"/logcat.txt "$M"/crash.txt . 2>/dev/null || true
          printf '# Play review media\n\nRecorded by `.github/workflows/play-videos.yml` from %s (run %s).\nUpload the MP4s to YouTube as "unlisted" and paste the links into Play Console › App-Inhalte.\n' \
            "${{ github.sha }}" "${{ github.run_id }}" > README.md
          git init -q -b play-review-media
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Play review media from ${{ github.sha }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:play-review-media

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: play-review-media
          path: |
            ${{ runner.temp }}/media/*.mp4
            ${{ runner.temp }}/media/screenshots/
            ${{ runner.temp }}/media/fail-*.png
            ${{ runner.temp }}/media/segments/
          retention-days: 14
