name: Instrumentation Tests

# Manual-only: runs the RdpSessionSmokeTest on an Android emulator with
# an xrdp sidecar. Not wired into normal push/PR because:
#   - macos-latest runners are expensive (10x ubuntu minute cost)
#   - xrdp-in-docker is flaky and false negatives would block merges
#   - real release gating is the manual QA checklist in
#     docs/FREERDP_INTEGRATION.md
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 60
    services:
      xrdp:
        image: linuxserver/xrdp:3389
        ports:
          - 3389:3389
        env:
          PUID: 1000
          PGID: 1000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Verify AAR present
        run: test -f core/rdp/libs/freerdp-android.aar
      - name: Run connected test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: arm64-v8a
          profile: pixel_6
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
