name: PR Check

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Robolectric cache key
        id: robolectric-key
        shell: bash
        run: |
          # From the Robolectric version and the Android jars of :app and :tv only (the build files
          # change with every release, these lines do not).
          HASH=$( { grep -E '^robolectric = ' gradle/libs.versions.toml; grep -h 'val robolectricAndroidAll' app/build.gradle.kts tv/build.gradle.kts; } | sha256sum | cut -c1-16)
          echo "key=robolectric-android-all-$HASH" >> "$GITHUB_OUTPUT"
          echo "GC_ROBOLECTRIC_DIR=$HOME/.robolectric-android-all" >> "$GITHUB_ENV"

      - name: Restore Robolectric Android jars
        id: robolectric-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.robolectric-android-all
          key: ${{ steps.robolectric-key.outputs.key }}

      - name: Download Robolectric Android jars (cache miss, with retries)
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Maven Central answers 429 at times: back off 30, 60, 120 s.
          for attempt in 1 2 3 4; do
            if ./gradlew :app:robolectricDeps :tv:robolectricDeps; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              WAIT=$(( 30 * (1 << (attempt - 1)) ))
              echo "::warning::Robolectric jar download failed (attempt $attempt), retrying in ${WAIT}s"
              sleep "$WAIT"
            fi
          done
          exit 1

      - name: Save Robolectric Android jars
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.robolectric-android-all
          key: ${{ steps.robolectric-key.outputs.key }}

      - name: Run unit tests
        run: ./gradlew test --continue

      - name: Run lint
        run: ./gradlew lintRelease

      - name: Check for unguarded HTTP body logging
        run: |
          if grep -rn 'Level\.BODY' --include='*.kt' --include='*.java' . | grep -v 'isDebuggable\|BuildConfig\.DEBUG\|FLAG_DEBUGGABLE' | grep -v '\.gradle'; then
            echo "::error::Found unguarded Level.BODY HTTP logging. Wrap with a debug-only check to prevent credential leaks in release builds."
            exit 1
          fi

      - name: Check for credential leaks in logs
        run: |
          if grep -rn 'Timber\.\(d\|i\|w\|e\).*\(password\|Password\|PASSWORD\|secret\|credential\)' \
            --include='*.kt' --include='*.java' . \
            | grep -v 'Test\|test\|\.gradle'; then
            echo "::error::Found potential credential logging. Never log passwords or secrets."
            exit 1
          fi

      - name: Check FLAG_SECURE on RDP Activity
        run: |
          if grep -rn 'class RdpSessionActivity' --include='*.kt' -l .; then
            if ! grep -n 'FLAG_SECURE' app/src/main/java/com/gatecontrol/android/rdp/RdpSessionActivity.kt; then
              echo "::error::RdpSessionActivity must set FLAG_SECURE to prevent screenshots"
              exit 1
            fi
          fi

      - name: Generate coverage report
        if: always()
        run: ./gradlew jacocoTestReport || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: app/build/reports/jacoco/
          retention-days: 3

      - name: Build debug APK (build check)
        # Phone app and GateControl TV (:tv)
        run: ./gradlew assembleDebug

      - name: Verify 16 KB page alignment of native libs
        run: python3 scripts/check_elf_alignment.py app/build/outputs/apk/debug/ tv/build/outputs/apk/debug/

      - name: Check GateControl TV APK (ABI and size)
        run: python3 scripts/check_tv_apk.py tv/build/outputs/apk/debug/tv-debug.apk

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: PR Unit Test Results
          path: '**/build/test-results/**/*.xml'
          reporter: java-junit
