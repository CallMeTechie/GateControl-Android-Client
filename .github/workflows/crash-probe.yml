name: Crash probe (temporary)

on:
  push:
    branches: [callmetechie/determined-knuth-awmcxl]
    paths: [.github/workflows/crash-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.21.0 -R ${{ github.repository }} -p 'GateControl-Android-1.21.0.apk' -O app.apk
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p com.gatecontrol.client -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.gatecontrol.client || echo "PROCESS NOT RUNNING"
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d > logcat.txt || true
            cat crash.txt
            grep -n -A40 "FATAL EXCEPTION" logcat.txt || echo "no FATAL in logcat"
            adb shell run-as com.gatecontrol.client ls files/crash || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: logcat-${{ matrix.api }}
          path: '*.txt'
