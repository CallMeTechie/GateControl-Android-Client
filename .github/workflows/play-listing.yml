name: Google Play Listing

# Uploads the store listing texts from fastlane/metadata/android (title,
# short and full description per language) to Google Play. By hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # fastlane: no update banner, no usage statistics
  FASTLANE_SKIP_UPDATE_CHECK: 'true'
  FASTLANE_OPT_OUT_USAGE: 'true'

jobs:
  listing:
    name: Upload store listing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is missing"
            exit 1
          fi
          KEY="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$KEY"
          bundle exec fastlane supply \
            --package_name com.gatecontrol.client \
            --json_key "$KEY" \
            --metadata_path fastlane/metadata/android \
            --skip_upload_aab true \
            --skip_upload_apk true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true
          rm -f "$KEY"
