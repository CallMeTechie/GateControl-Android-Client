version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # The android-all-instrumented jars are picked per Android SDK level that
      # Robolectric emulates (:app on 34, :tv on 28), not "newer is better".
      # Bumping them would silently test against another Android version.
      - dependency-name: "org.robolectric:android-all-instrumented"
    groups:
      gradle:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    # "ci:" commits land without a release (see release.yml "decide").
    commit-message:
      prefix: "ci"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
          - "major"
